# ---- Nginx Configuration ----

# Note: Log format and access_log are configured in 00-log-format.conf

resolver 127.0.0.11 ipv6=off valid=30s;
resolver_timeout 5s;


# ---- Dynamic upstream targets via variables ----
map "" $usersvc     { default "user-service:8002"; }
map "" $devicesvc   { default "device-core:8004"; }
map "" $appsvc      { default "application-service:8003"; }
map "" $missionsvc  { default "mission-service:8005"; }
map "" $deploysvc   { default "deployment-service:8006"; }
map "" $dashboardsvc { default "dashboard-service:8007"; }
map "" $alertsvc    { default "alert-service:8008"; }
map "" $trafficsvc  { default "traffic-management-service:8009"; } 
map "" $analyticssvc { default "analytics-service:8010"; } 
map "" $logsvc       { default "log-service:8011"; }
map "" $dbsvc        { default "db-manager:8012"; }
map "" $otasvc       { default "ota-update-service:8013"; }


# ---- Build Authorization header from jwt cookie (HTTP context) ----
map $http_cookie $jwt_token {
  default "";
  "~*jwt=([^;]+)" $1;
}
map $jwt_token $auth_bearer {
  default "";
  "~.+" "Bearer $jwt_token";
}

# ---- Cache (HTTP context) ----
proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=apicache:100m max_size=500m inactive=10m use_temp_path=off;

# ---- WebSocket upgrade helper ----
map $http_upgrade $connection_upgrade { default upgrade; "" close; }

# ---------------- HTTP -> HTTPS redirect ----------------
server {
  listen 80;
  return 301 https://$host:8443$request_uri;   # host port for 443 is 8443 in compose
}

# ---------------- HTTPS gateway ----------------
server {
  listen 443 ssl;
  http2 on;
  server_name localhost 127.0.0.1 10.122.72.153 _;

  # ---- HTTP to HTTPS redirect on 8443 (error 497) ----
  error_page 497 https://$host:8443$request_uri;

  # ---- TLS certs (mounted at /etc/nginx/certs) ----
  ssl_certificate     /etc/nginx/certs/fullchain.crt;
  ssl_certificate_key /etc/nginx/certs/fms.conque.trizlabz.com.key;
  

  # ---- Static files (logos) ----
  location /static/logos/ {
    alias /app/static/logos/;
    expires 30d;
    add_header Cache-Control "public, no-transform";
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Credentials "true" always;
    try_files $uri =404;
  }

  # ---- Frontend (Next.js) - Proxy to production container ----
  location / {
    # Proxy to Next.js production container
    # Port 3000 for Next.js
    
    proxy_pass http://fmscore-frontend:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    
    # WebSocket support for HMR (Hot Module Replacement)
    proxy_read_timeout 86400;
  }

  include snippets/api_locations.conf;
}

# ---------------- HTTPS gateway for German UI ----------------
server {
  listen 8444 ssl;
  http2 on;
  server_name localhost 127.0.0.1 192.168.147.208 fms.conque.trizlabz.com _;

  ssl_certificate     /etc/nginx/certs/fullchain.crt;
  ssl_certificate_key /etc/nginx/certs/fms.conque.trizlabz.com.key;

  # ---- Static files (logos) ----
  location /static/logos/ {
    alias /app/static/logos/;
    expires 30d;
    add_header Cache-Control "public, no-transform";
    add_header Access-Control-Allow-Origin * always;
    try_files $uri =404;
  }

  location / {
    proxy_pass http://fmscore-frontend-german:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 86400;
  }

  include snippets/api_locations.conf;
}
